[project]
name = "mahplan"
version = "0"
description = "Maharashtra Planning Department GRs, on GovDoc and docflow (orgpedia/doc). Not published."
requires-python = ">=3.12"
dependencies = ["govdoc", "govdoc-flow[ocr,unipdf,gcv,gemini,scans,indic]", "govdoc-studio", "mahdept", "huggingface_hub>=0.26"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.sources]
# pinned by tag (the template's spec §G1a); uv.lock records the commits. make dev installs the local checkouts over them
govdoc = { git = "https://github.com/orgpedia/doc", tag = "v0.7.2", subdirectory = "packages/govdoc" }
govdoc-flow = { git = "https://github.com/orgpedia/doc", tag = "v0.7.2", subdirectory = "packages/docflow" }
govdoc-studio = { git = "https://github.com/orgpedia/doc", tag = "v0.7.2", subdirectory = "packages/studio" }
mahdept = { git = "https://github.com/orgpedia/template.mahdept", tag = "v0.6.5", subdirectory = "packages/mahdept" }

[tool.ruff]
line-length = 120
indent-width = 2
